name: Documentation
on:
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola 0.23.6
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output zola.tar.gz https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz
          echo '8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4  zola.tar.gz' | sha256sum --check
          tar -xzf zola.tar.gz zola
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: zola --root site check --skip-external-links
      - run: zola --root site build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
